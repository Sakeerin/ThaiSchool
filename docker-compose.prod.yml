version: '3.8'

# ─────────────────────────────────────────────
# Thai School LMS - Full Production Stack
# Usage: docker-compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────

services:
  # ── Infrastructure ──────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: school_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-school_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  redis:
    image: redis:7-alpine
    container_name: school_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-network

  minio:
    image: minio/minio:latest
    container_name: school_minio_prod
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - school-network

  # ── Application Services ─────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: school_api_prod
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-school_management}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:4000/api/health" ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - school-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: school_web_prod
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - school-network

volumes:
  postgres_data:
  redis_data:
  minio_data:


networks:
  school-network:
    driver: bridge
